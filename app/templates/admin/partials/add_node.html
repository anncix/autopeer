{# Add node form - included from admin/nodes.html #}
<div class="card">
  <h2 data-i18n="admin.add_node">Add a node</h2>
  <form method="post" action="/admin/nodes" class="form-grid">
    <label class="field" data-i18n="admin.name">Name<input name="name" placeholder="frankfurt" required></label>
    <label class="field" data-i18n="admin.location">Location<input name="location" placeholder="DE"></label>
    <label class="field" data-i18n="admin.public_addr">Public address<input name="url" placeholder="pop.example.net or 172.20.0.1" required></label>
    <label class="field" data-i18n="admin.asn">ASN <span class="muted" data-i18n="common.optional">(optional)</span><input name="asn" placeholder="4242420000"></label>
    <label class="field" data-i18n="admin.dn42_ipv4">DN42 IPv4 <span class="muted" data-i18n="common.optional">(optional)</span><input name="dn42_ipv4" placeholder="172.20.0.1"></label>
    <label class="field" data-i18n="admin.dn42_ipv6">DN42 IPv6 <span class="muted" data-i18n="common.optional">(optional)</span><input name="dn42_ipv6" placeholder="fd00::1"></label>
    <label class="checkbox-label" data-i18n="admin.enabled"><input type="checkbox" name="enabled" checked> Enabled</label>
    <button type="submit" class="btn-primary" data-i18n="admin.create_node">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>Create node</span>
    </button>
  </form>
</div>
